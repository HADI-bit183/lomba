<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="400" height="250">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6558f5"/>
      <stop offset="100%" stop-color="#08b9c7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="250" rx="12" fill="url(#bg)"/>
  <!-- Neural network nodes -->
  <circle cx="120" cy="80" r="14" fill="url(#accent)" opacity="0.9"/>
  <circle cx="200" cy="50" r="10" fill="#8a7eff" opacity="0.7"/>
  <circle cx="280" cy="80" r="14" fill="url(#accent)" opacity="0.9"/>
  <circle cx="160" cy="140" r="12" fill="#36d1d8" opacity="0.8"/>
  <circle cx="240" cy="140" r="12" fill="#36d1d8" opacity="0.8"/>
  <circle cx="200" cy="195" r="16" fill="url(#accent)" opacity="0.95"/>
  <!-- Connections -->
  <line x1="120" y1="80" x2="160" y2="140" stroke="#6558f5" stroke-width="1.5" opacity="0.4"/>
  <line x1="120" y1="80" x2="240" y2="140" stroke="#6558f5" stroke-width="1.5" opacity="0.3"/>
  <line x1="200" y1="50" x2="160" y2="140" stroke="#8a7eff" stroke-width="1.5" opacity="0.3"/>
  <line x1="200" y1="50" x2="240" y2="140" stroke="#8a7eff" stroke-width="1.5" opacity="0.3"/>
  <line x1="280" y1="80" x2="240" y2="140" stroke="#6558f5" stroke-width="1.5" opacity="0.4"/>
  <line x1="280" y1="80" x2="160" y2="140" stroke="#6558f5" stroke-width="1.5" opacity="0.3"/>
  <line x1="160" y1="140" x2="200" y2="195" stroke="#36d1d8" stroke-width="1.5" opacity="0.5"/>
  <line x1="240" y1="140" x2="200" y2="195" stroke="#36d1d8" stroke-width="1.5" opacity="0.5"/>
  <!-- Brain icon in center node -->
  <text x="200" y="201" text-anchor="middle" fill="#fff" font-size="16" font-family="sans-serif">🧠</text>
  <!-- Label -->
  <text x="200" y="238" text-anchor="middle" fill="#b8b9cb" font-size="11" font-family="Inter,sans-serif" letter-spacing="0.08em">AI LEARNING ASSISTANT</text>
</svg>
