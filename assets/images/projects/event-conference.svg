      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
  </defs>
  <rect width="400" height="250" rx="12" fill="url(#bg)"/>
  <!-- Stage/podium -->
  <rect x="120" y="140" width="160" height="6" rx="3" fill="#6558f5" opacity="0.6"/>
  <rect x="100" y="146" width="200" height="4" rx="2" fill="#6558f5" opacity="0.3"/>
  <!-- Screen -->
  <rect x="145" y="55" width="110" height="70" rx="6" fill="#151624" stroke="#6558f5" stroke-width="1.5" opacity="0.8"/>
  <rect x="155" y="65" width="90" height="20" rx="3" fill="#6558f5" opacity="0.2"/>
  <rect x="155" y="90" width="60" height="8" rx="2" fill="#08b9c7" opacity="0.3"/>
  <rect x="155" y="103" width="75" height="8" rx="2" fill="#08b9c7" opacity="0.2"/>
  <!-- Audience seats (dots) -->
  <g opacity="0.4">
    <circle cx="100" cy="180" r="5" fill="#8a7eff"/><circle cx="120" cy="182" r="5" fill="#8a7eff"/>
    <circle cx="140" cy="180" r="5" fill="#8a7eff"/><circle cx="160" cy="181" r="5" fill="#8a7eff"/>
    <circle cx="180" cy="180" r="5" fill="#8a7eff"/><circle cx="200" cy="182" r="5" fill="#8a7eff"/>
    <circle cx="220" cy="180" r="5" fill="#8a7eff"/><circle cx="240" cy="181" r="5" fill="#8a7eff"/>
    <circle cx="260" cy="180" r="5" fill="#8a7eff"/><circle cx="280" cy="182" r="5" fill="#8a7eff"/>
    <circle cx="300" cy="180" r="5" fill="#8a7eff"/>
  </g>
  <g opacity="0.25">
    <circle cx="85" cy="200" r="5" fill="#8a7eff"/><circle cx="105" cy="202" r="5" fill="#8a7eff"/>
    <circle cx="125" cy="200" r="5" fill="#8a7eff"/><circle cx="145" cy="201" r="5" fill="#8a7eff"/>
    <circle cx="165" cy="200" r="5" fill="#8a7eff"/><circle cx="185" cy="202" r="5" fill="#8a7eff"/>
    <circle cx="205" cy="200" r="5" fill="#8a7eff"/><circle cx="225" cy="201" r="5" fill="#8a7eff"/>
    <circle cx="245" cy="200" r="5" fill="#8a7eff"/><circle cx="265" cy="202" r="5" fill="#8a7eff"/>
    <circle cx="285" cy="200" r="5" fill="#8a7eff"/><circle cx="305" cy="201" r="5" fill="#8a7eff"/>
    <circle cx="325" cy="200" r="5" fill="#8a7eff"/>
  </g>
  <!-- Speaker silhouette -->
  <circle cx="200" cy="118" r="7" fill="#36d1d8" opacity="0.6"/>
  <rect x="195" y="126" width="10" height="14" rx="4" fill="#36d1d8" opacity="0.5"/>
  <!-- Spotlight beams -->
  <polygon points="200,40 170,55 230,55" fill="#e9a23b" opacity="0.08"/>
  <!-- Label -->
  <text x="200" y="238" text-anchor="middle" fill="#b8b9cb" font-size="11" font-family="Inter,sans-serif" letter-spacing="0.08em">AI CONFERENCE 2026</text>
