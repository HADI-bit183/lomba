<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="400" height="250">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#052e16"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16a778"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <rect width="400" height="250" rx="12" fill="url(#bg)"/>
  <!-- Grid lines (field rows) -->
  <line x1="50" y1="180" x2="350" y2="180" stroke="#16a778" stroke-width="0.7" opacity="0.25"/>
  <line x1="50" y1="160" x2="350" y2="160" stroke="#16a778" stroke-width="0.7" opacity="0.2"/>
  <line x1="50" y1="140" x2="350" y2="140" stroke="#16a778" stroke-width="0.7" opacity="0.15"/>
  <!-- Plants -->
  <g opacity="0.9">
    <rect x="90" y="140" width="3" height="40" rx="1.5" fill="#059669"/>
    <ellipse cx="91" cy="132" rx="10" ry="14" fill="url(#leaf)" opacity="0.85"/>
    <rect x="150" y="150" width="3" height="30" rx="1.5" fill="#059669"/>
    <ellipse cx="151" cy="143" rx="9" ry="12" fill="url(#leaf)" opacity="0.8"/>
    <rect x="210" y="135" width="3" height="45" rx="1.5" fill="#059669"/>
    <ellipse cx="211" cy="126" rx="11" ry="15" fill="url(#leaf)" opacity="0.9"/>
    <rect x="270" y="148" width="3" height="32" rx="1.5" fill="#059669"/>
    <ellipse cx="271" cy="140" rx="9" ry="13" fill="url(#leaf)" opacity="0.8"/>
    <rect x="330" y="142" width="3" height="38" rx="1.5" fill="#059669"/>
    <ellipse cx="331" cy="134" rx="10" ry="13" fill="url(#leaf)" opacity="0.85"/>
  </g>
  <!-- IoT sensor nodes -->
  <circle cx="91" cy="100" r="6" fill="#08b9c7" opacity="0.8"/>
  <circle cx="211" cy="90" r="6" fill="#08b9c7" opacity="0.8"/>
  <circle cx="331" cy="95" r="6" fill="#08b9c7" opacity="0.8"/>
  <!-- Signal waves -->
  <circle cx="91" cy="100" r="12" fill="none" stroke="#08b9c7" stroke-width="1" opacity="0.3"/>
  <circle cx="211" cy="90" r="12" fill="none" stroke="#08b9c7" stroke-width="1" opacity="0.3"/>
  <circle cx="331" cy="95" r="12" fill="none" stroke="#08b9c7" stroke-width="1" opacity="0.3"/>
  <!-- Data connection lines -->
  <line x1="97" y1="100" x2="205" y2="90" stroke="#08b9c7" stroke-width="1" opacity="0.25" stroke-dasharray="4 3"/>
  <line x1="217" y1="90" x2="325" y2="95" stroke="#08b9c7" stroke-width="1" opacity="0.25" stroke-dasharray="4 3"/>
  <!-- Sun -->
  <circle cx="340" cy="45" r="18" fill="#e9a23b" opacity="0.3"/>
  <circle cx="340" cy="45" r="10" fill="#e9a23b" opacity="0.6"/>
  <!-- Label -->
  <text x="200" y="238" text-anchor="middle" fill="#a7f3d0" font-size="11" font-family="Inter,sans-serif" letter-spacing="0.08em">SMART FARMING SYSTEM</text>
</svg>
