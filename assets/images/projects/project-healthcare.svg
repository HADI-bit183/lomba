<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="400" height="250">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6558f5"/>
      <stop offset="50%" stop-color="#08b9c7"/>
      <stop offset="100%" stop-color="#6558f5"/>
    </linearGradient>
  </defs>
  <rect width="400" height="250" rx="12" fill="url(#bg)"/>
  <!-- Heart rate line -->
  <polyline points="30,140 80,140 95,140 105,100 115,170 125,120 135,140 180,140 195,140 205,95 215,175 225,115 235,140 290,140 350,140 370,140" fill="none" stroke="url(#pulse)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
  <!-- Heart icon -->
  <g transform="translate(200,75)" opacity="0.7">
    <path d="M0,8 C0,-4 -14,-8 -14,4 C-14,16 0,24 0,24 C0,24 14,16 14,4 C14,-8 0,-4 0,8Z" fill="#e95865" opacity="0.8"/>
  </g>
  <!-- Cross icon (medical) -->
  <g transform="translate(320, 65)" opacity="0.5">
    <rect x="-3" y="-10" width="6" height="20" rx="2" fill="#08b9c7"/>
    <rect x="-10" y="-3" width="20" height="6" rx="2" fill="#08b9c7"/>
  </g>
  <!-- Data points -->
  <circle cx="80" cy="55" r="4" fill="#36d1d8" opacity="0.5"/>
  <circle cx="120" cy="45" r="3" fill="#8a7eff" opacity="0.4"/>
  <circle cx="290" cy="60" r="3.5" fill="#36d1d8" opacity="0.45"/>
  <!-- Dashboard bars at bottom -->
  <rect x="70" y="185" width="24" height="30" rx="4" fill="#6558f5" opacity="0.4"/>
  <rect x="104" y="175" width="24" height="40" rx="4" fill="#6558f5" opacity="0.5"/>
  <rect x="138" y="190" width="24" height="25" rx="4" fill="#08b9c7" opacity="0.4"/>
  <rect x="172" y="170" width="24" height="45" rx="4" fill="#08b9c7" opacity="0.5"/>
  <rect x="206" y="182" width="24" height="33" rx="4" fill="#6558f5" opacity="0.45"/>
  <rect x="240" y="175" width="24" height="40" rx="4" fill="#6558f5" opacity="0.5"/>
  <rect x="274" y="188" width="24" height="27" rx="4" fill="#08b9c7" opacity="0.4"/>
  <rect x="308" y="178" width="24" height="37" rx="4" fill="#08b9c7" opacity="0.45"/>
  <!-- Label -->
  <text x="200" y="238" text-anchor="middle" fill="#b8b9cb" font-size="11" font-family="Inter,sans-serif" letter-spacing="0.08em">DIGITAL HEALTHCARE PLATFORM</text>
</svg>
